name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT is required instead of the default GITHUB_TOKEN: commits
          # authored by the default token don't trigger other workflow runs
          # (to prevent infinite loops), so merging the "chore: version
          # packages" PR below would otherwise never re-trigger this
          # workflow to actually run the publish step.
          token: ${{ secrets.GH_PAT }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # All packages are versioned together (see `fixed` group in
      # .changeset/config.json), so every release bumps every package to
      # the same version number, keeping them in sync even when a change
      # only touches one package.
      #
      # `changeset version` rewrites each bumped package.json with its own
      # JSON formatting, which doesn't match Biome's style (e.g. it expands
      # single-line arrays like `"files": ["dist"]` across multiple lines),
      # so `pnpm format` re-normalizes the diff before it's committed to the
      # version PR — otherwise `ci.yml`'s Lint step fails on that PR.
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version && pnpm format
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
