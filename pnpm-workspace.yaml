packages:
  - "packages/*"

allowBuilds:
  '@biomejs/biome': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  # Scarf is an install-time telemetry/analytics ping (transitive dependency
  # pulled in by the new @pakiso/docs VitePress toolchain); deny its
  # postinstall script rather than running arbitrary telemetry code.
  '@scarf/scarf': false
